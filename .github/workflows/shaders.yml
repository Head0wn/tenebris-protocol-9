name: Shader CI

on:
  push:
    paths:
      - "assets/shaders/**"
      - ".github/workflows/shaders.yml"
  pull_request:
    branches: [main]
    paths:
      - "assets/shaders/**"
      - ".github/workflows/shaders.yml"

permissions:
  contents: write

concurrency:
  group: tenebris-shaders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-validate:
    name: Compile and validate Vulkan shaders
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools spirv-tools

      - name: Compile shaders
        run: |
          mkdir -p assets/shaders/compiled build/shaders
          glslangValidator -V --target-env vulkan1.2 \
            -o assets/shaders/compiled/voxel.vert.spv assets/shaders/voxel.vert
          glslangValidator -V --target-env vulkan1.2 \
            -o assets/shaders/compiled/voxel.frag.spv assets/shaders/voxel.frag
          cp assets/shaders/compiled/voxel.vert.spv build/shaders/voxel.vert.spv
          cp assets/shaders/compiled/voxel.frag.spv build/shaders/voxel.frag.spv

      - name: Validate SPIR-V
        run: |
          spirv-val --target-env vulkan1.2 build/shaders/voxel.vert.spv
          spirv-val --target-env vulkan1.2 build/shaders/voxel.frag.spv

      - name: Inspect shader interfaces
        run: |
          spirv-dis build/shaders/voxel.vert.spv > build/shaders/voxel.vert.spvasm
          spirv-dis build/shaders/voxel.frag.spv > build/shaders/voxel.frag.spvasm
          grep -q "OpDecorate.*Location 0" build/shaders/voxel.vert.spvasm
          grep -q "OpDecorate.*Location 1" build/shaders/voxel.vert.spvasm
          grep -q "OpDecorate.*Location 2" build/shaders/voxel.vert.spvasm
          grep -q "PushConstant" build/shaders/voxel.vert.spvasm

      - name: Report validated shader fingerprints
        run: sha256sum build/shaders/voxel.vert.spv build/shaders/voxel.frag.spv

      - name: Persist validated shader binaries
        if: >-
          github.event_name == 'push'
          && github.ref_name != 'main'
          && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shaders/compiled/voxel.vert.spv assets/shaders/compiled/voxel.frag.spv
          if git diff --cached --quiet; then
            echo "Validated shader binaries are already current."
            exit 0
          fi
          git commit -m "assets: persist validated voxel SPIR-V"
          git push
