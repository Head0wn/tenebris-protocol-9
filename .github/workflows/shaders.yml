name: Shader CI

on:
  push:
    branches: [main]
    paths:
      - "assets/shaders/**"
      - ".github/workflows/shaders.yml"
  pull_request:
    branches: [main]
    paths:
      - "assets/shaders/**"
      - ".github/workflows/shaders.yml"

permissions:
  contents: read

concurrency:
  group: tenebris-shaders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-validate:
    name: Compile and validate Vulkan shaders
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools spirv-tools

      - name: Compile shaders
        run: |
          mkdir -p build/shaders
          glslangValidator -V --target-env vulkan1.2 \
            -o build/shaders/voxel.vert.spv assets/shaders/voxel.vert
          glslangValidator -V --target-env vulkan1.2 \
            -o build/shaders/voxel.frag.spv assets/shaders/voxel.frag

      - name: Validate SPIR-V
        run: |
          spirv-val --target-env vulkan1.2 build/shaders/voxel.vert.spv
          spirv-val --target-env vulkan1.2 build/shaders/voxel.frag.spv

      - name: Inspect shader interfaces
        run: |
          spirv-dis build/shaders/voxel.vert.spv > build/shaders/voxel.vert.spvasm
          spirv-dis build/shaders/voxel.frag.spv > build/shaders/voxel.frag.spvasm
          grep -q "OpDecorate.*Location 0" build/shaders/voxel.vert.spvasm
          grep -q "OpDecorate.*Location 1" build/shaders/voxel.vert.spvasm
          grep -q "OpDecorate.*Location 2" build/shaders/voxel.vert.spvasm
          grep -q "PushConstant" build/shaders/voxel.vert.spvasm

      - name: Upload validated shaders
        uses: actions/upload-artifact@v4
        with:
          name: tenebris-voxel-shaders
          path: |
            build/shaders/voxel.vert.spv
            build/shaders/voxel.frag.spv
          if-no-files-found: error
          retention-days: 14
