name: Visual Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/platform/**"
      - "engine/renderer/**"
      - "engine/scene/**"
      - "game/**"
      - "assets/shaders/**"
      - "scripts/run-visual-validation.bat"
      - "docs/VISUAL_VALIDATION.md"
      - ".github/workflows/visual-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/platform/**"
      - "engine/renderer/**"
      - "engine/scene/**"
      - "game/**"
      - "assets/shaders/**"
      - "scripts/run-visual-validation.bat"
      - "docs/VISUAL_VALIDATION.md"
      - ".github/workflows/visual-validation.yml"

permissions:
  contents: write

concurrency:
  group: tenebris-visual-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan-smoke:
    name: Vulkan software-GPU smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Vulkan and SDL dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libudev-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers \
            xvfb xauth

      - name: Configure Debug renderer
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DTENEBRIS_BUILD_TESTS=ON
          -DTENEBRIS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run automated tests
        run: ctest --test-dir build --output-on-failure

      - name: Run 300-frame Vulkan validation
        run: |
          LVP_ICD="$(dpkg -L mesa-vulkan-drivers | grep -E '/(lvp|lavapipe).*\.json$' | head -n 1)"
          if [ -z "$LVP_ICD" ] || [ ! -f "$LVP_ICD" ]; then
            echo "Lavapipe ICD not found. Installed Vulkan manifests:"
            find /usr/share/vulkan /etc/vulkan -type f -name '*.json' -print 2>/dev/null || true
            exit 1
          fi
          echo "Using Lavapipe ICD: $LVP_ICD"
          export VK_DRIVER_FILES="$LVP_ICD"
          export VK_ICD_FILENAMES="$LVP_ICD"
          vulkaninfo --summary
          timeout 90s xvfb-run -a -s "-screen 0 1600x900x24" \
            ./build/game/TENEBRIS --gpu-smoke-test

  windows-package:
    name: Windows portable validation build
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Release build
        run: >-
          cmake -S . -B build
          -DTENEBRIS_BUILD_TESTS=ON
          -DTENEBRIS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run automated tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Assemble portable package
        shell: pwsh
        run: |
          $stage = "dist/TENEBRIS-0.7.0-Site47"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/game/Release/TENEBRIS.exe" $stage
          Copy-Item "build/game/Release/assets" $stage -Recurse
          Copy-Item "scripts/run-visual-validation.bat" "$stage/START-TENEBRIS.bat"
          Copy-Item "docs/VISUAL_VALIDATION.md" "$stage/LISEZ-MOI.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/TENEBRIS-0.7.0-Site47-Windows.zip" -CompressionLevel Optimal
          Get-FileHash "dist/TENEBRIS-0.7.0-Site47-Windows.zip" -Algorithm SHA256

      - name: Publish Windows validation prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.7.0-visual-validation"
          $asset = "dist/TENEBRIS-0.7.0-Site47-Windows.zip"
          $repository = $env:GITHUB_REPOSITORY

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $repository `
              --target $env:GITHUB_SHA `
              --title "TENEBRIS 0.7.0 — Site 47 Visual Validation" `
              --notes "Première build Windows inspectable du rendu voxel Vulkan de Site 47. Cette préversion sert à valider le cadrage, les matériaux, la profondeur, le redimensionnement et la stabilité GPU avant la production gameplay." `
              --prerelease
          }

          gh release upload $tag $asset --repo $repository --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release asset upload failed."
          }
