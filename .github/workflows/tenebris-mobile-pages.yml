name: TENEBRIS Mobile Web

on:
  push:
    branches:
      - agent/tenebris-mobile-web
    paths:
      - 'web/mobile/**'
      - '.github/workflows/tenebris-mobile-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tenebris-mobile-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated web branch
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload mobile game only
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/mobile
      - name: Deploy mobile game
        id: deployment
        uses: actions/deploy-pages@v4
