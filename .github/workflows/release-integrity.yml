name: Release Integrity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-integrity.yml"

permissions:
  contents: read

concurrency:
  group: tenebris-release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows-prerelease:
    name: Verify Windows prerelease package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v0.7.0-visual-validation
      RELEASE_ASSET: TENEBRIS-0.7.0-Site47-Windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inspect published release metadata
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          tag_name="$(jq -r '.tag_name' <<<"$release_json")"
          prerelease="$(jq -r '.prerelease' <<<"$release_json")"
          asset_count="$(jq --arg asset "$RELEASE_ASSET" '[.assets[] | select(.name == $asset)] | length' <<<"$release_json")"
          asset_size="$(jq -r --arg asset "$RELEASE_ASSET" '.assets[] | select(.name == $asset) | .size' <<<"$release_json")"
          asset_digest="$(jq -r --arg asset "$RELEASE_ASSET" '.assets[] | select(.name == $asset) | (.digest // "unavailable")' <<<"$release_json")"

          test "$tag_name" = "$RELEASE_TAG"
          test "$prerelease" = "true"
          test "$asset_count" = "1"
          test "$asset_size" -gt 0

          echo "Release tag : $tag_name"
          echo "Asset       : $RELEASE_ASSET"
          echo "Size        : $asset_size bytes"
          echo "Digest      : $asset_digest"

      - name: Download and validate portable package
        run: |
          set -euo pipefail
          mkdir -p verified
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ASSET" \
            --dir verified

          archive="verified/$RELEASE_ASSET"
          test -s "$archive"
          unzip -t "$archive"
          unzip -Z1 "$archive" > verified/contents.txt

          grep -qE '(^|/)TENEBRIS\.exe$' verified/contents.txt
          grep -qE '(^|/)START-TENEBRIS\.bat$' verified/contents.txt
          grep -qE '(^|/)LISEZ-MOI\.md$' verified/contents.txt
          grep -qE '(^|/)assets/shaders/compiled/voxel\.vert\.spv$' verified/contents.txt
          grep -qE '(^|/)assets/shaders/compiled/voxel\.frag\.spv$' verified/contents.txt

          sha256sum "$archive"
          echo "Published TENEBRIS Windows validation package is complete and readable."
