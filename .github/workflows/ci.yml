name: Engine CI

on:
  push:
    branches:
      - main
      - 'engine/**'
      - 'foundation/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tenebris-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SDL3 Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libudev-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DTENEBRIS_BUILD_TESTS=ON
          -DTENEBRIS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel 2

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

      - name: Stage Windows Vulkan validation build
        if: runner.os == 'Windows' && matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $stage = "artifacts/TENEBRIS-Vulkan-Validation"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/game/Release/TENEBRIS.exe" "$stage/TENEBRIS.exe"
          Copy-Item "scripts/validate-vulkan.ps1" "$stage/validate-vulkan.ps1"
          Copy-Item "docs/GPU_VALIDATION.md" "$stage/LISEZ-MOI.md"

      - name: Upload Windows Vulkan validation build
        if: runner.os == 'Windows' && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v5
        with:
          name: TENEBRIS-Vulkan-Validation-Windows
          path: artifacts/TENEBRIS-Vulkan-Validation
          if-no-files-found: error
          retention-days: 14
